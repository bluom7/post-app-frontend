function urlBase64ToUint8Array(b64) {
  var pad = '='.repeat((4 - b64.length % 4) % 4);
  var raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  var out = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}
async function setupPushNotifications(tok) {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    var reg = await navigator.serviceWorker.ready;
    var existing = await reg.pushManager.getSubscription();
    if (existing) return;
    var perm = await Notification.requestPermission();
    if (perm !== 'granted') return;
    var vr = await fetch(API + '/notifications/vapid-key', { headers: { Authorization: 'Bearer ' + tok } });
    if (!vr.ok) return;
    var vd = await vr.json();
    if (!vd.public_key) return;
    var sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(vd.public_key) });
    var sr = await fetch(API + '/notifications/push-subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok },
      body: JSON.stringify(sub.toJSON())
    });
    if (!sr.ok) { console.log('[Push] Subscribe rejected by server:', sr.status); return; }
    console.log('[Push] Subscribed');
  } catch(e) { console.log('[Push] Failed:', e.message); }
}
