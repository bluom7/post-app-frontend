// === Service Worker + Web Push ===
function urlBase64ToUint8Array(b64) {
  var pad = '='.repeat((4 - b64.length % 4) % 4);
  var raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  var out = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}
async function setupPushNotifications(tok) {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    var reg = await navigator.serviceWorker.ready;
    var existing = await reg.pushManager.getSubscription();
    if (existing) return;
    var perm = await Notification.requestPermission();
    if (perm !== 'granted') return;
    var vr = await fetch(API + '/notifications/vapid-key', { headers: { Authorization: 'Bearer ' + tok } });
    if (!vr.ok) return;
    var vd = await vr.json();
    if (!vd.public_key) return;
    var sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(vd.public_key) });
    var sr = await fetch(API + '/notifications/push-subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok },
      body: JSON.stringify(sub.toJSON())
    });
    if (!sr.ok) { console.log('[Push] Subscribe rejected by server:', sr.status); return; }
    console.log('[Push] Subscribed');
  } catch(e) { console.log('[Push] Failed:', e.message); }
}
if ('serviceWorker' in navigator) {

    navigator.serviceWorker.register('./sw.js')

<!-- ADDED: JS to wrap videos and show first frame/poster to avoid black placeholder -->
<script>
(function(){
  function makeWrap(v){
    if (v.dataset._fixed) return;
    v.dataset._fixed = '1';
    var posterUrl = v.getAttribute('poster') || v.getAttribute('data-poster');
    var wrap = document.createElement('div');
    wrap.className = 'video-wrap';

    // respect explicit data-aspect or data-ratio if provided
    var ar = v.getAttribute('data-aspect') || v.getAttribute('data-ratio') || '';
    if (!ar) {
      var w = v.getAttribute('width'), h = v.getAttribute('height');
      if (w && h) ar = (w/ h).toString();
    }
    if (ar) {
      try { wrap.style.aspectRatio = ar; } catch(e) {}
    }

    var p = null;
    if (posterUrl) {
      p = document.createElement('div');
      p.className = 'poster';
      p.style.backgroundImage = 'url("'+posterUrl+'")';
      wrap.appendChild(p);
    }

    v.parentNode.insertBefore(wrap, v);
    wrap.appendChild(v);

    // set playsinline for mobile autoplay rules
    v.setAttribute('playsinline','');

    function show(){
      wrap.classList.add('loaded');
      if (p) try{ p.remove(); }catch(e){}
      v.removeEventListener('loadeddata', show);
    }

    v.addEventListener('loadeddata', show);
    v.addEventListener('loadedmetadata', function(){
      try { v.currentTime = 0.01; } catch (e) { /* may be blocked by CORS */ }
    });
  }

  function init(){
    document.querySelectorAll('video').forEach(makeWrap);
    var obs = new MutationObserver(function(mutations){
      mutations.forEach(function(rec){
        rec.addedNodes.forEach(function(node){
          if (node.nodeType !== 1) return;
          if (node.tagName === 'VIDEO') makeWrap(node);
          else if (node.querySelectorAll) node.querySelectorAll('video').forEach(makeWrap);
        });
      });
    });
    obs.observe(document.body, { childList: true, subtree: true });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
