services:
  - type: web
    name: post-app-frontend
    runtime: static
    rootDir: .
    buildCommand: echo ok
    staticPublishPath: .
    autoDeploy: yes
    pullRequestPreviewsEnabled: false
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /aiagent.js
        name: Cache-Control
        value: no-cache
